<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mach Runtime Tracker</title>
<style>
:root{--bg:#050d16;--bg2:#0a1a28;--panel:rgba(16,33,48,.62);--panel2:rgba(255,255,255,.045);--text:#eef6f8;--muted:#8fa8b7;--line:rgba(140,190,215,.16);--accent:#39e0a0;--accent2:#2bb6e8;--amber:#ffb84d;--gold:#ffd86b;--danger:#ff7b7b;--ink:#032015;--glow:rgba(57,224,160,.35);--ring:var(--accent)}
body.light{--bg:#eaf2f5;--bg2:#dbe9ee;--panel:rgba(255,255,255,.78);--panel2:rgba(20,60,80,.05);--text:#10283a;--muted:#5b7482;--line:rgba(20,70,95,.15);--accent:#12a672;--accent2:#1488b8;--amber:#d98200;--gold:#c99600;--danger:#d64545;--ink:#fff;--glow:rgba(18,166,114,.3)}
body.paused{--ring:var(--amber);--glow:rgba(255,184,77,.32)}
body.done{--ring:var(--gold);--glow:rgba(255,216,107,.4)}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:radial-gradient(1200px 700px at 15% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;transition:background .6s}
svg{display:block}
.bgfx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;transition:background 1s}
.bgfx i:nth-child(1){width:46vw;height:46vw;left:-12vw;top:-14vw;background:var(--ring);animation:drift 18s ease-in-out infinite alternate}
.bgfx i:nth-child(2){width:38vw;height:38vw;right:-10vw;bottom:-12vw;background:var(--accent2);animation:drift 22s ease-in-out infinite alternate-reverse}
.bgfx:after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%)}
@keyframes drift{to{transform:translate(6vw,5vh) scale(1.15)}}
.app{position:relative;z-index:1;height:100vh;height:100dvh;width:100%;display:flex;flex-direction:column;padding:clamp(10px,2.2vh,30px) clamp(12px,2.4vw,34px);gap:clamp(10px,2vh,24px);overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:var(--ink);box-shadow:0 8px 28px var(--glow);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
h1{font-size:clamp(19px,2.3vw,27px);margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.tools{display:flex;align-items:center;gap:10px}
.clock{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;padding:0 6px}
.ibtn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.ibtn:hover{transform:translateY(-2px);border-color:var(--ring);box-shadow:0 8px 22px var(--glow)}
.ibtn:active{transform:scale(.94)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(14px,2vw,28px);align-items:stretch}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 60px -24px rgba(0,0,0,.55)}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:clamp(12px,2.6vh,40px);gap:clamp(10px,2vh,18px);position:relative}
